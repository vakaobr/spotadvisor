services:
  spot-monitor:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ./gcp-credentials.json:/app/gcp-credentials.json
    environment:
      - NODE_ENV=production
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
      - GCP_PROJECT_ID=vcpro-467612
    restart: unless-stopped
